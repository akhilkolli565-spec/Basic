<!DOCTYPE html>
<html>
<head>
    <title>Registration From</title>
</head>
<body>

<center>
    <h2><u><font color="red"><i>Registration Form</i></font></u></h2>

    <form>
        <table cellpadding="8">

            <tr>
                <td>Enter First Name <font color="red">*</font></td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td>Enter Last Name <font color="red">*</font></td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td>Enter Email ID <font color="red">*</font></td>
                <td><input type="email" required></td>
            </tr>

            <tr>
                <td>Enter Contact Number <font color="red">*</font></td>
                <td><input type="tel" required></td>
            </tr>

            <tr>
                <td>Enter Age</td>
                <td><input type="number"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Select City</td>
                <td>
                    <select>
                        <option>Select City</option>
                        <option>Hyderabad</option>
                        <option>Chennai</option>
                        <option>Bengaluru</option>
                        <option>Mumbai</option>
                        <option>Delhi</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Hobby</td>
                <td>
                    <input type="checkbox"> Singing
                    <input type="checkbox"> Dancing
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea rows="5" cols="25"></textarea>
                </td>
            </tr>

            <tr>
                <td>Upload Your Picture</td>
                <td>
                    <input type="file">
                </td>
            </tr>

            <tr>
                <td>Enter Password <font color="red">*</font></td>
                <td><input type="password" required></td>
            </tr>

            <tr>
                <td>Confirm Password <font color="red">*</font></td>
                <td><input type="password" required></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>
    </form>
</center>

</body>
</html>
